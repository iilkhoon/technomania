version: '3.8'

services:
  # 1. Self-Hosted PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: technomania_postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - technomania_net

  # 2. Central NestJS API Server (Production)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: technomania_backend
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://admin:password@postgres:5432/postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=technomania_meili_secret_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ERP_SECRET_KEY=technomania_secure_erp_token_2026_98x!
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
      - meilisearch
    networks:
      - technomania_net

  # 3. Redis Cache & Realtime State
  redis:
    image: redis:7-alpine
    container_name: technomania_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - technomania_net

  # 4. Next.js Customer Web Storefront (Production: technomania.az / :3001)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: technomania_web
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - PORT=3001
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - technomania_net

  # 5. Next.js ERP Panel (Production: /erp / :3000)
  erp:
    build:
      context: ./apps/erp
      dockerfile: Dockerfile
    container_name: technomania_erp
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_ERP_SECRET_KEY=technomania_secure_erp_token_2026_98x!
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - technomania_net

  # 6. Ultra-Fast Search Engine (Meilisearch)
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: technomania_meilisearch
    restart: always
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      - MEILI_MASTER_KEY=technomania_meili_secret_2026
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    networks:
      - technomania_net

volumes:
  postgres_data:
  meili_data:

networks:
  technomania_net:
    driver: bridge
